<style>
[data-testid="stSidebarNav"] { display: none !important; }
html, body, [data-testid="stAppViewContainer"], [data-testid="stMain"], [data-testid="stMainBlockContainer"] {
    overflow: hidden !important;
    height: 100vh !important;
}
[data-testid="stMainBlockContainer"] {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
}
.splash-container {
    max-width: 680px;
    width: 100%;
    margin: auto !important;
    padding: 2.2rem 2.5rem;
    background: linear-gradient(135deg, rgba(17, 24, 39, 0.75) 0%, rgba(15, 23, 42, 0.85) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 0 50px rgba(45, 212, 191, 0.03), 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f1f5f9;
    text-align: center;
}
.splash-title {
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: 0.15rem;
    background: linear-gradient(90deg, #2dd4bf, #60a5fa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
}
.splash-subtitle {
    font-size: 1rem;
    color: #64748b;
    margin-bottom: 1.25rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}
.splash-tasks {
    text-align: left;
    margin: 1.5rem auto;
    max-width: 540px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 12px;
    padding: 1.5rem;
}
.task-item {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    font-size: 0.92rem;
    transition: all 0.3s ease;
    white-space: nowrap;
}
.task-item:last-child {
    margin-bottom: 0;
}
.task-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
}
.task-icon.check-glow {
    color: #34d399;
    background: rgba(52, 211, 153, 0.12);
    border-radius: 50%;
    font-size: 0.85rem;
    font-weight: bold;
    box-shadow: 0 0 8px rgba(52, 211, 153, 0.2);
}
.task-icon.pending {
    border: 1.5px solid rgba(148, 163, 184, 0.2);
    border-radius: 50%;
    width: 20px;
    height: 20px;
}
.pulse-loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #38bdf8;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
}
.flicker-text {
    font-size: 0.95rem;
    color: #2dd4bf;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.02em;
    animation: flicker 1.8s infinite ease-in-out;
}
@keyframes flicker {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 3px rgba(45, 212, 191, 0.4)); }
    50% { opacity: 0.25; filter: drop-shadow(0 0 0px transparent); }
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
<div class="splash-container">
    <div class="splash-title">XAI Efficiency Benchmark</div>
    <div class="splash-subtitle">Initializing System Environment</div>
    <div class="splash-tasks">
        <div class="task-item" data-style="style1">
            <!-- status1 -->
            <span><b>Loading AI Engine</b>: Importing PyTorch, NumPy, & Pandas...</span>
        </div>
        <div class="task-item" data-style="style2">
            <!-- status2 -->
            <span><b>Loading XAI Suite</b>: Initializing Captum explainability algorithms...</span>
        </div>
        <div class="task-item" data-style="style3">
            <!-- status3 -->
            <span><b>Hardware Check</b>: Detecting GPU (CUDA/MPS) acceleration...</span>
        </div>
        <div class="task-item" data-style="style4">
            <!-- status4 -->
            <span><b>Workspace Setup</b>: Creating cache and session database...</span>
        </div>
    </div>
    <!-- launching_html -->
</div>
